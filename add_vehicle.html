{% extends 'base.html' %}{% block title %}Add Vehicle{% endblock %}{% block content %}<section class="section narrow"><a class="back" href="{{url_for('dealer_dashboard')}}">← Dealer dashboard</a><div class="panel"><h1>Add a vehicle</h1><p>Enter accurate listing details for buyers to browse.</p><form method="post" class="formgrid"><input type="hidden" name="csrf" value="{{csrf}}"><div><label>Year</label><input required type="number" name="year" min="1980" max="2030"></div><div><label>Make</label><input required name="make" maxlength="50"></div><div><label>Model</label><input required name="model" maxlength="50"></div><div><label>Trim</label><input name="trim" maxlength="80"></div><div><label>Price ($)</label><input required type="number" min="0" name="price"></div><div><label>Mileage</label><input required type="number" min="0" name="mileage"></div><div><label>VIN</label><input name="vin" maxlength="17"></div><div><label>Image URL (https://)</label><input name="image_url" type="url" placeholder="https://..."></div><div class="wide"><label>Description</label><textarea name="description" rows="4"></textarea></div><button class="btn gold wide">Publish Vehicle →</button></form></div></section>{% endblock %}
