
{% extends 'base.html' %}

{% block title %}Saved Cars | WE-SELL{% endblock %}

{% block content %}

<style>
.saved-page {
    max-width: 1150px;
    margin: 50px auto;
    padding: 20px;
    min-height: 60vh;
}

.saved-page h1 {
    font-size: 36px;
    color: #09243f;
    margin-bottom: 10px;
}

.saved-subtitle {
    color: #64748b;
    margin-bottom: 30px;
}

.saved-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 22px;
}

.saved-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
}

.saved-card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
}

.saved-card-body {
    padding: 20px;
}

.saved-card h3 {
    color: #09243f;
    margin: 0 0 12px;
}

.saved-price {
    font-size: 22px;
    font-weight: 800;
    color: #09243f;
    margin-bottom: 15px;
}

.saved-view {
    display: inline-block;
    background: #09243f;
    color: white;
    text-decoration: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: 700;
}

.saved-remove {
    display: block;
    margin-top: 12px;
    background: none;
    border: none;
    color: #dc2626;
    cursor: pointer;
    padding: 5px 0;
}

.saved-empty {
    background: #f4f7fb;
    text-align: center;
    padding: 65px 20px;
    border-radius: 18px;
}

.saved-empty h2 {
    color: #09243f;
}

.saved-empty p {
    color: #64748b;
    margin-bottom: 25px;
}

.saved-heart {
    font-size: 65px;
    color: #e5a900;
}

.saved-empty a {
    display: inline-block;
    background: #eab83d;
    color: #09243f;
    padding: 13px 25px;
    border-radius: 9px;
    font-weight: 800;
    text-decoration: none;
}

[hidden] {
    display: none !important;
}
</style>

<section class="saved-page">

    <h1>♡ My Saved Cars</h1>

    <p class="saved-subtitle">
        Your favorite vehicles, all in one place.
    </p>

    <div id="saved-grid" class="saved-grid"></div>

    <div id="saved-empty" class="saved-empty" hidden>
        <div class="saved-heart">♡</div>

        <h2>No Saved Cars Yet</h2>

        <p>
            Browse our vehicles and click the heart
            to save your favorite cars.
        </p>

        <a href="{{ url_for('home') }}">
            Browse Vehicles →
        </a>
    </div>

</section>

<script>
document.addEventListener('DOMContentLoaded', function () {

    const storageKey = 'wesell_saved_cars';
    const grid = document.getElementById('saved-grid');
    const empty = document.getElementById('saved-empty');

    function getSavedCars() {
        try {
            const cars = JSON.parse(
                localStorage.getItem(storageKey) || '[]'
            );
            return Array.isArray(cars) ? cars : [];
        } catch (error) {
            return [];
        }
    }

    function renderSavedCars() {
        const cars = getSavedCars();
        grid.replaceChildren();

        empty.hidden = cars.length > 0;

        cars.forEach(function (car) {
            if (!car || !car.id) return;

            const card = document.createElement('article');
            card.className = 'saved-card';

            if (car.image) {
                const img = document.createElement('img');
                img.src = car.image;
                img.alt = car.title || 'Vehicle';
                card.appendChild(img);
            }

            const body = document.createElement('div');
            body.className = 'saved-card-body';

            const title = document.createElement('h3');
            title.textContent = car.title || 'Saved Vehicle';

            const price = document.createElement('div');
            price.className = 'saved-price';
            price.textContent = car.price || '';

            const link = document.createElement('a');
            link.className = 'saved-view';
            link.href = '/vehicle/' + encodeURIComponent(car.id);
            link.textContent = 'View Vehicle →';

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'saved-remove';
            remove.textContent = '♡ Remove from Saved Cars';

            remove.addEventListener('click', function () {
                const updated = getSavedCars().filter(
                    item => String(item.id) !== String(car.id)
                );

                localStorage.setItem(
                    storageKey,
                    JSON.stringify(updated)
                );

                renderSavedCars();
            });

            body.append(title, price, link, remove);
            card.appendChild(body);
            grid.appendChild(card);
        });

        empty.hidden = grid.children.length > 0;
    }

    renderSavedCars();
});
</script>

{% endblock %}
