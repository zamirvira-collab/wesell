
{% extends 'base.html' %}

{% block title %}Add Vehicle | WE-SELL{% endblock %}

{% block content %}

<section class="section narrow">

  <a class="back" href="{{ url_for('dealer_dashboard') }}">
    ← Dealer dashboard
  </a>

  <div class="panel">

    <h1>Add a Vehicle</h1>

    <p>
      Enter accurate vehicle information so buyers can
      find your inventory by location and distance.
    </p>

    <form method="post" class="formgrid">

      <input type="hidden" name="csrf" value="{{ csrf }}">

      <!-- YEAR -->
      <div>
        <label for="vehicle-year">Year</label>
        <input
          id="vehicle-year"
          required
          type="number"
          name="year"
          min="1980"
          max="2030"
          placeholder="2025">
      </div>

      <!-- CONDITION -->
      <div>
        <label for="vehicle-condition">Vehicle Condition</label>
        <select id="vehicle-condition" name="condition" required>
          <option value="used" selected>Used Car</option>
          <option value="new">New Car</option>
        </select>
      </div>

      <!-- MAKE -->
      <div>
        <label for="vehicle-make">Make</label>
        <input
          id="vehicle-make"
          required
          name="make"
          maxlength="50"
          placeholder="Toyota">
      </div>

      <!-- MODEL -->
      <div>
        <label for="vehicle-model">Model</label>
        <input
          id="vehicle-model"
          required
          name="model"
          maxlength="50"
          placeholder="Camry">
      </div>

      <!-- TRIM -->
      <div>
        <label for="vehicle-trim">Trim</label>
        <input
          id="vehicle-trim"
          name="trim"
          maxlength="80"
          placeholder="SE, XLE, Limited">
      </div>

      <!-- PRICE -->
      <div>
        <label for="vehicle-price">Price ($)</label>
        <input
          id="vehicle-price"
          required
          type="number"
          min="0"
          name="price"
          placeholder="25000">
      </div>

      <!-- MILEAGE -->
      <div>
        <label for="vehicle-mileage">Mileage</label>
        <input
          id="vehicle-mileage"
          required
          type="number"
          min="0"
          name="mileage"
          placeholder="45000">
      </div>

      <!-- LOCATION -->
      <div>
        <label for="vehicle-zip">Vehicle Location (ZIP Code)</label>
        <input
          id="vehicle-zip"
          required
          type="text"
          name="zip_code"
          inputmode="numeric"
          pattern="[0-9]{5}"
          maxlength="5"
          title="Enter a valid 5-digit ZIP code"
          placeholder="Example: 92020">
        <small>
          Enter the ZIP code where the vehicle is located.
        </small>
      </div>

      <!-- VIN -->
      <div>
        <label for="vehicle-vin">VIN</label>
        <input
          id="vehicle-vin"
          name="vin"
          maxlength="17"
          placeholder="17-character VIN">
      </div>

      <!-- IMAGE -->
      <div>
        <label for="vehicle-image">Image URL (https://)</label>
        <input
          id="vehicle-image"
          name="image_url"
          type="url"
          placeholder="https://...">
      </div>

      <!-- DESCRIPTION -->
      <div class="wide">
        <label for="vehicle-description">Description</label>
        <textarea
          id="vehicle-description"
          name="description"
          rows="4"
          placeholder="Describe the vehicle's features, condition, and highlights."></textarea>
      </div>

      <!-- PUBLISH -->
      <button type="submit" class="btn gold wide">
        Publish Vehicle →
      </button>

    </form>

  </div>

</section>

{% endblock %}
